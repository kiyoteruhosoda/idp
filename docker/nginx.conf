# Single origin, path routing (ADR-0007 §2, ADR-0009 §6, MT13). Browsers come to one origin
# (the proxy), which routes to web / api by path. The SSO Cookie reaches both services on one domain.
#
# This config is used only when `.env` states `PUBLISH_TOPOLOGY=single-origin`. The default is
# `nginx.domain-split.conf`, which splits by listen port (ADR-0015, ADR-0016).
#
# In MT13 web's screen URLs became tenant routes (`/{tenant_id}/login` etc.), and web's admin console
# (HTML) shares the `/{tenant_id}/admin/...` namespace with the api's JSON admin API
# (Progress.md MT13, ADR-0009 §6, §10; browsers must always reach web's HTML console, and API clients such as `curl`
# must reach the api's JSON). The path alone cannot distinguish them, so
# `/{tenant_id}/admin/...` is routed by the `Accept` header
# (browser navigation sends `Accept: text/html,...`; API clients expecting JSON do not).
#
# - `/internal/*`                              -> blocked externally (404; web->api internal calls bypass the
#                                                  proxy and go directly inside the Compose network)
# - `/{tenant_id}/admin(/...)?`                 -> web (HTML console) if Accept contains `text/html`,
#                                                  otherwise api (JSON admin API)
# - `/{tenant_id}/(login|password-change|forgot-password|password-reset|verify-email|settings|consent|mfa/...|account/...|passkey/...)` -> web (HTML screens)
# - `/{tenant_id}/logout`                         -> web (GET = OIDC RP-Initiated Logout,
#                                                  POST = portal screen logout; ADR-0018 decision 2)
# - `/{tenant_id}/invitations/accept`             -> web (acceptance screen) if Accept contains `text/html`,
#                                                  otherwise api (JSON; direct calls by signed-in users)
# - `/`                                      -> web (leads to the root tenant's admin login screen)
# - `/assets/*`                               -> web (bundled static assets such as the shared stylesheet and React islands)
# - everything else (`/{tenant_id}/authorize`, `/token`, `/userinfo`, `/.well-known/*`, `/healthz`,
#   `/api/docs` etc.)                            -> api (OIDC protocol, health, OpenAPI)
#
# web connects directly to the api on the server side (API_BASE_URL=http://api:8080), so this proxy
# handles only browser traffic. It adds X-Forwarded-*, and api/web interpret the client IP and scheme from it.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Drop the nginx version from the response `Server` header and error pages (minimize information exposure).
    server_tokens off;

    # Do not log query strings (use `$uri` instead of `$request`). The `/authorize` handoff
    # URL carries a single-use, short-lived handle (`?auth_session=`), so the default format would copy the
    # pre-exchange handle into logs (an acceptance criterion of ADR-0018 decision 2). The query of `/authorize` itself
    # (state, code_challenge etc.) is dropped likewise.
    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent"';
    access_log /dev/stdout redacted;
    error_log  /dev/stderr;

    upstream api { server api:8080; }
    upstream web { server web:8081; }

    # Routing target of `/{tenant_id}/admin/...`. Only browser HTML navigation (Accept contains text/html)
    # goes to web (admin console). JSON API clients such as curl fall through to api by default.
    map $http_accept $admin_backend {
        default   api;
        "~*text/html" web;
    }


    server {
        listen 8080;

        proxy_set_header Host $host;
        # The client IP is **overwritten** (appending while keeping the client's claim, like $proxy_add_x_forwarded_for,
        # lets spoofing through when api/web take the first entry; SEC1).
        # If another proxy or CDN sits in front, put the real IP back in there.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # The internal API is not reachable via the proxy (defense in depth; web->api goes directly inside the Compose network).
        location /internal/ { return 404; }

        # Sending the root to api would 404 as an undefined OIDC/API path, so send it to web. web returns a generic guide page
        # that does not expose any tenant's UUID (no redirect from `/`, so the root cannot be guessed).
        location = / { proxy_pass http://web; }

        # Prebuilt static assets (shared stylesheet /assets/app.css, React islands /assets/react/* etc.).
        # web renders the HTML, and assets are served across the same boundary (web). Without this, the catch-all sends them to api
        # and /assets/app.css and /assets/react/app.js would 404.
        location /assets/ { proxy_pass http://web; }

        # Binding SSO sessions to the device key (Chrome DBSC; task #887, ADR-0074). The register and refresh endpoints are in web.
        location /dbsc/ { proxy_pass http://web; }

        # Tenant-UUID-prefixed admin console / JSON admin API (web/api share the namespace).
        # Routed by the Accept header (see comment).
        location ~ "^/[0-9a-fA-F-]{36}/admin(/.*)?$" {
            proxy_pass http://$admin_backend;
        }

        # Tenant-UUID-prefixed HTML screens (except the admin console) go to web.
        # `settings` (profile settings), password reset and email verification are web screens too.
        location ~ "^/[0-9a-fA-F-]{36}/(login|password-change|forgot-password|password-reset|account-setup|verify-email|settings|consent|device-enrollment|mfa/|account/|passkey/|external/)" {
            proxy_pass http://web;
        }

        # `/logout` is handled by web for both GET (OIDC RP-Initiated Logout; end_session_endpoint) and POST (portal screen
        # logout) (ADR-0018 decision 2: the api does not read browser Cookies).
        location ~ "^/[0-9a-fA-F-]{36}/logout$" {
            proxy_pass http://web;
        }

        # The SAML namespace is split between api (/saml/sso, /saml/metadata) and web (/saml/continue).
        # Only `/saml/continue` is a web HTML screen; the rest fall through the catch-all to api.
        location ~ "^/[0-9a-fA-F-]{36}/saml/continue$" {
            proxy_pass http://web;
        }

        # Invitation acceptance shares the same path between the HTML screen (web) and the JSON API (api). Routed by Accept.
        location ~ "^/[0-9a-fA-F-]{36}/invitations/accept$" {
            proxy_pass http://$admin_backend;
        }

        # Everything else (OIDC protocol, health, OpenAPI etc.) goes to api.
        location / { proxy_pass http://api; }
    }
}
