# Reverse proxy config for domain-split publishing (ADR-0012, ADR-0015). **Services are split by listen port**.
# `PUBLISH_TOPOLOGY` defaults to `domain-split`, so this config is the default routing (ADR-0016).
# To go back to single-origin path routing, use `nginx.conf` (switched by `PUBLISH_TOPOLOGY` in `.env`).
#
# The front reverse proxy (Synology DSM etc.) routes by domain and forwards here per port:
#
#   https://id.example.com   -> ${WEB_BIND_HOST}:${WEB_PORT} -> 8080 of this config -> web
#   https://api.example.com  -> ${API_BIND_HOST}:${API_PORT} -> 8081 of this config -> api
#
# Ports and services are 1:1, so the path routing in `nginx.conf` (branching
# `/{tenant_id}/admin` by the `Accept` header, explicit `/assets/` and `/version` etc.) is not needed at all.
# No domain names are written in this config, so DNS and certificate changes do not ripple into nginx (ADR-0015).
#
# api and web containers are not published to the host (the only public point is always this proxy). So
# blocking `/internal/*` is guaranteed in this one config, as in the single-origin setup.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Drop the nginx version from the response `Server` header and error pages (minimize information exposure).
    server_tokens off;

    # Do not log query strings (use `$uri` instead of `$request`). The `/authorize` handoff
    # URL carries a single-use, short-lived handle (`?auth_session=`), so the default format would copy the
    # pre-exchange handle into logs (an acceptance criterion of ADR-0018 decision 2). The query of `/authorize` itself
    # (state, code_challenge etc.) is dropped likewise.
    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent"';
    access_log /dev/stdout redacted;
    error_log  /dev/stderr;

    upstream api { server api:8080; }
    upstream web { server web:8081; }

    # Browser-facing HTML (login screen, admin console). web's public origin
    # (`PUBLIC_WEB_BASE_URL`) comes to this port.
    # Container port 8080 is assigned to web so that the proxy health check
    # (`/readyz` to 127.0.0.1:8080) and the single-origin port publishing definitions can be reused unchanged.
    server {
        listen 8080;

        proxy_set_header Host $host;
        # The client IP is **overwritten** (appending while keeping the client's claim, like $proxy_add_x_forwarded_for,
        # lets spoofing through when api/web take the first entry; SEC1).
        # If another proxy or CDN sits in front, put the real IP back in there.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # The internal API is not reachable via the proxy (defense in depth; web->api goes directly inside the Compose network).
        location /internal/ { return 404; }

        location / { proxy_pass http://web; }
    }

    # OIDC protocol, JSON admin API, health, OpenAPI. The api's public origin (`ISSUER`)
    # comes to this port.
    server {
        listen 8081;

        proxy_set_header Host $host;
        # The client IP is **overwritten** (appending while keeping the client's claim, like $proxy_add_x_forwarded_for,
        # lets spoofing through when api/web take the first entry; SEC1).
        # If another proxy or CDN sits in front, put the real IP back in there.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        location /internal/ { return 404; }

        location / { proxy_pass http://api; }
    }
}
