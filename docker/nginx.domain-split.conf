# 別ドメイン公開（ADR-0012・ADR-0015）用のリバースプロキシ設定。**リッスンポートでサービスを分ける**。
# `PUBLISH_TOPOLOGY` の既定が `domain-split` なので、本設定が既定の振り分けである（ADR-0016）。
# 単一オリジン・パスルーティングへ戻す場合は `nginx.conf`（`.env` の `PUBLISH_TOPOLOGY` で切替）。
#
# 前段のリバースプロキシ（Synology DSM 等）がドメインで振り分け、ここへポート単位で流す:
#
#   https://id.example.com   → ${WEB_BIND_HOST}:${WEB_PORT} → 本設定の 8080 → web
#   https://api.example.com  → ${API_BIND_HOST}:${API_PORT} → 本設定の 8081 → api
#
# ポートとサービスが 1:1 なので、`nginx.conf` にあるパス振り分け（`Accept` ヘッダによる
# `/{tenant_id}/admin` の分岐・`/assets/`・`/version` の個別指定など）は一切不要になる。
# 本設定にドメイン名を書かないため、DNS・証明書の変更が nginx へ波及しない（ADR-0015）。
#
# api・web コンテナはホストへ publish しない（公開点は常に本プロキシだけ）。そのため
# `/internal/*` の遮断は単一オリジン構成と同じく本設定 1 か所で担保される。

worker_processes auto;
events { worker_connections 1024; }

http {
    # クエリ文字列をログに残さない（`$request` ではなく `$uri` を使う）。`/authorize` のハンドオフ
    # URL には単回・短命のハンドル（`?auth_session=`）が載るため、既定フォーマットだと交換前の
    # ハンドルがログへ複製される（ADR-0018 決定 2 の受け入れ条件）。`/authorize` 自体のクエリ
    # （state・code_challenge 等）も同様に落とす。
    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent"';
    access_log /dev/stdout redacted;
    error_log  /dev/stderr;

    upstream api { server api:8080; }
    upstream web { server web:8081; }

    # ブラウザ向け HTML（ログイン画面・管理コンソール）。web の公開オリジン
    # （`PUBLIC_WEB_BASE_URL`）がこのポートへ来る。
    # コンテナ内 8080 を web に割り当てているのは、proxy のヘルスチェック
    # （`/readyz` を 127.0.0.1:8080 へ）と単一オリジン構成のポート公開定義を無変更で流用するため。
    server {
        listen 8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # 内部 API はプロキシ経由では到達させない（多層防御。web→api は Compose ネットワーク内で直結）。
        location /internal/ { return 404; }

        location / { proxy_pass http://web; }
    }

    # OIDC protocol・JSON 管理 API・health・OpenAPI。api の公開オリジン（`ISSUER`）が
    # このポートへ来る。
    server {
        listen 8081;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        location /internal/ { return 404; }

        location / { proxy_pass http://api; }
    }
}
