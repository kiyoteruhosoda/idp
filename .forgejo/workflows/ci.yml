name: CI

on:
  # ⚠ **枝への push では走らせない**（forge へ移したとき変えた）。素の `push:` は
  #   全部の枝を拾うので、PR を開いている枝では **push と pull_request で
  #   同じコミットを 2 回**組むことになる。GitHub の台は要るだけ増えるので
  #   誰も困らなかったが、⚠ **セルフホストは 3 台しかなく、しかも 2 本が
  #   同じ置き場で待たされる**
  #   （2026-09-11 に実測。1 本が 200% CPU、もう 1 本が 0.5% で待っていた）。
  push:
    branches: [main]
  pull_request:

# 同じ枝（PR）へ続けて push したら、古い実行は取り消して最新の commit だけを検査する。
# ⚠ **main も取り消す**（2026-09-28 の決定）。間の commit には合否が残らない代わりに、
#   main への push が続いた日に古い検査がランナーの列を塞がない。副作用のある workflow には当てない。
# ⚠ **別の枝どうしの取り合いはここでは防いでいない**（group が枝ごとのため）。
#   別の PR や main のジョブとは並んで走る ——置き場（`target/`）を分けているのは
#   下の `scripts/with-target-lock.sh`（3 つの置き場から空いている番を取る）である。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust
    # ⚠ **docker を使わない関門はこちらの台**（docker.sock を渡さない）。
    runs-on: [self-hosted, nolumialab]
    # ⚠ 既定は 6 時間。ぶら下がったジョブが台を食い潰すので上限を置く。
    timeout-minutes: 60
    # ⚠ **ジョブそのものをこのイメージの中で走らせる**（forge へ移したとき変えた）。
    #   GitHub では `dtolnay/rust-toolchain@stable` が毎回 rustup で取り直し、
    #   `Swatinem/rust-cache@v2` が中間物を持ち回っていた。
    #   ⚠ **`Swatinem/rust-cache` は act_runner では効かない** ——中身は
    #   `actions/cache` で、キャッシュ置き場はランナーのコンテナの IP で待って
    #   おり、ジョブのコンテナからは経路が無い。そこで**イメージに toolchain を
    #   焼き、中間物は名前付きボリューム**へ置く（定義は deploy-repo の
    #   `host/services/builders/ci-rust/`、許可は台の `valid_volumes`）。
    # ⚠ **digest で固定する。** タグのままだと、焼き直した日に
    #   「昨日は通ったものが通らない」が起きて原因を追えない。
    container:
      image: hub.nolumia.com:5000/builder/ci-rust@sha256:cbdb8ac42a47a544c455a441133e0076b85766dbf267913ef44de0569d935752
      # `target/` の置き場は 3 つ（番 1〜3）。ランナーの台が 3 台なので 4 つ目は要らない。
      #   どのジョブにも 3 つとも付け、使うのは最初の段で取った 1 つだけ
      #   （`scripts/with-target-lock.sh --take`、https://task.nolumia.com/issues/702）。
      # ⚠ **`target/` は放っておくと上限なく育つ**（cargo は古い成果物を掃除しない。1 つの置き場に
      #   52 GB 積もっていた）。番を取ったときに 20 GB を超えていれば空にしてから使う。
      #   中身はいつ捨ててもよい（次回が遅くなるだけ）: `docker volume rm rust-target-cache-idp-ci-<番>`。
      #   ⚠ **naso には置かない**（1 Gbps・週次の再起動で装置が振り直される・ネットワーク越しの flock は当てにならない）。
      options: >-
        -v rust-cargo-registry:/cache/cargo
        -v rust-target-cache-idp-ci-1:/cache/target-1
        -v rust-target-cache-idp-ci-2:/cache/target-2
        -v rust-target-cache-idp-ci-3:/cache/target-3
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: idp
          MARIADB_USER: idp
          MARIADB_PASSWORD: idp
          MARIADB_ROOT_PASSWORD: root
        # ⚠ **`ports:` を書かない**（forge へ移したとき外した）。GitHub の台では
        #   サービスをホストへ出して `127.0.0.1:3306` で触っていたが、ここでは
        #   ジョブもコンテナの中に居るので**同じネットワークの `mariadb:3306`**
        #   で届く。出すと**ホストの 3306 を占有し、2 本同時に走れなくなる**。
        # ⚠ **データはメモリ（tmpfs）に置く**（2026-09-30）。試験の DB は終われば捨てるのに、
        #   コミットごとの fsync が nolumialab の NVMe（DRAM なしで 1 回 100〜300 ms 待つ）へ
        #   届き、同じディスクに載る k3s・deck まで待たせていた。上限は runner-burst が
        #   `shmem` としてメモリの見込みに数える。
        options: >-
          --tmpfs /var/lib/mysql:rw,size=2g
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # ⚠ **`127.0.0.1` ではない**（上の注記）。
      DATABASE_URL: mysql://idp:idp@mariadb:3306/idp
      TEST_DATABASE_URL: mysql://idp:idp@mariadb:3306/idp
      # 中間物と取得物をボリュームへ逃がす（ワークスペースは毎回消えるため）。
      # ⚠ `CARGO_TARGET_DIR` はここに書かない。番を取る段が `$GITHUB_ENV` で後の段へ渡す。
      CARGO_HOME: /cache/cargo
      # ⚠ **書く量を減らす**（2026-09-30）。既定のままだと 1 run で約 63 GB を nolumialab の
      #   NVMe（DRAM なし）へ書き、同じディスクの k3s・deck まで止めていた。試験の実行ファイルは
      #   1 本 450 MB 前後で、ほとんどがデバッグ情報だった。
      #   - デバッグ情報は行番号だけ残す（panic・バックトレースの位置は出る。変数は見えない）
      #   - incremental は切る。PR ごとに中身が変わる CI では当たらず、`target/` に 19 GB 積もっていた
      #   ⚠ CI だけの設定。手元のビルドは変えない。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      # 32 文字以上（`assay_contracts::deployment::INTERNAL_SERVICE_TOKEN_MIN_LEN`）。SEC11。
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-0123456789
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MARIADB_PASSWORD: idp
      MARIADB_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      # ⚠ **scripts/ に固定の `/tmp/<名前>` を書かない。** 手元では別々のセッションが
      #   同じ容れ物で同時にスクリプトを流すので、固定の道は互いの中間出力を踏み、
      #   毎回違う行で落ちる（https://task.nolumia.com/tasks/86）。⚠ CI は 1 本ずつ
      #   走るので**試験では捕まらない** ——ここで字面を止める。作業場所は `mktemp -d`。
      #   ⚠ 行頭の `#`（説明）は除く ——禁じているものを注記で名指しできなくなるため。
      - name: No fixed /tmp paths in scripts
        run: |
          if grep -nE '(^|[^A-Za-z0-9_])/tmp/' scripts/*.sh | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "scripts/ に固定の /tmp が残っています。mktemp -d で実行ごとの作業場所を作ってください。" >&2
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Target lock tests
        run: ./scripts/test_with_target_lock.sh
      # ⚠ **`target/` を使う段は必ず `scripts/with-target-lock.sh` を通し、その前にこの段を置く。**
      #   置き場は PR と main のジョブで使い回しているので、番を握らずに cargo を回すと
      #   別のジョブに組んだ実行ファイルを消され、試験の中身は ok のまま赤になる
      #   （2026-09-16 に 5 回。症状と理由はスクリプトの冒頭）。
      #   番はジョブが終わるまで握り続ける ——後の段は前の段が組んだものを使ってよい。
      #   ⚠ 3 つとも埋まっていれば空くまで待ち、その時間も `timeout-minutes` に数えられる。
      - name: Take a target slot
        run: ./scripts/with-target-lock.sh --take
      - name: Clippy
        run: ./scripts/with-target-lock.sh cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and DB integration tests
        run: ./scripts/with-target-lock.sh cargo test --workspace --locked
      - name: Shell deployment tests
        run: ./scripts/test_deploy.sh
      - name: Remote build/deploy script tests
        run: ./scripts/test_build_remote.sh
      - name: E2E
        run: ./scripts/with-target-lock.sh ./scripts/e2e.sh

  bundle:
    name: Deploy bundle
    # ⚠ **この関門だけ台が違う。** `docker build` をするので、ジョブのイメージに
    #   docker が入っている台へ回す。⚠ ここへ来たジョブは**ホスト root 相当**
    #   になる（socket を持つため）。
    runs-on: [nolumialab-docker]
    # ⚠ **Renovate の PR では走らせない**（task #603）。この台はジョブに docker.sock を
    #   渡す ——版上げの PR は人が見る前に CI が走るので、依存に悪意の版が混ざると
    #   その場でホスト root を取られる。飛ばしたジョブは緑に数えられる。
    if: github.event.pull_request.user.login != 'renovate'
    timeout-minutes: 45
    container:
      image: hub.nolumia.com:5000/builder/ci-docker@sha256:b611785e67553d881dba8c446ee90edfaf5cdfff1fc632648e139997d3aa0522
    # ⚠ **`docker compose config` は値を解決するので、秘密の「形」が要る。**
    #   GitHub では 1 つのジョブが全部やっていて、`test` 側に置いた env が
    #   そのまま効いていた ——**割った側でここが抜けると
    #   `required variable ... is missing a value` で落ちる**（2026-09-11 に実測）。
    #   ⚠ 中身は捨て値でよい（ここでは何も起動しない）。
    env:
      MARIADB_PASSWORD: idp
      MARIADB_ROOT_PASSWORD: root
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-0123456789
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7

      # ⚠ **docker の設定ディレクトリを、このジョブ専用の書ける場所へ向ける。**
      #   ランナーはホストの `/root/.docker` を**読み取り専用**で mount している。
      #   既定のままだと docker が `~/.docker` を作れずに落ち、しかも Node は
      #   読み取り専用を **ENOENT**（「そんなファイルは無い」）として報せるので、
      #   ログを読んでも原因に辿り着けない。
      # ⚠ **ジョブの `env:` では書けない。** そこで使える文脈に `runner` は無く、
      #   `${{ runner.temp }}` と書くと**ワークフローの読み込みごと失敗する**。
      - name: docker の設定ディレクトリを用意する
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - name: Docker build and deploy bundle
        run: ./scripts/build.sh

      # ⚠ **`config` は組み立てるだけで mount しない。** 相対パスの bind mount が
      #   18 か所あるが、ここで空のディレクトリが生えることはない（生えるのは
      #   `up` したとき）。
      # ⚠ **`--quiet` にしない理由**: ここは構文だけでなく**解決後の値**を見たいが、
      #   出力はファイルへ落として画面に出さない ——`docker compose config` は
      #   秘密を平文で展開する。
      - name: Compose config
        run: |
          docker compose -f docker-compose.yml config >/tmp/compose.yml
          docker compose -f docker-compose.deploy.yml config >/tmp/compose.deploy.yml

      # ランナーは docker-out-of-docker（ホストのデーモンをそのまま使う）なので、
      # 焼いたイメージはジョブが終わってもホストに残り続ける。ここで片付ける。
      - name: 後始末（焼いたイメージを消す）
        if: always()
        run: |
          docker image rm -f idp/api:latest idp/web:latest idp/migrate:latest || true
