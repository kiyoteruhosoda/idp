name: CI

on:
  # ⚠ **Do not run on pushes to branches** (changed when moving to forge). A bare `push:`
  #   picks up every branch, so a branch with an open PR would build **the same commit
  #   twice, via push and pull_request**. GitHub adds as many runners as needed, so
  #   nobody minded, but ⚠ **self-hosted has only 3 runners, and the two runs
  #   wait on the same storage**
  #   (measured 2026-09-11: one run at 200% CPU, the other waiting at 0.5%).
  push:
    branches: [main]
  pull_request:

# On consecutive pushes to the same branch (PR), cancel the old run and test only the latest commit.
# ⚠ **main is cancelled too** (decided 2026-09-28). Intermediate commits get no result, but in exchange
#   old checks do not clog the runner queue on days with many pushes to main. Not for workflows with side effects.
# ⚠ **Contention between different branches is not prevented here** (the group is per branch).
#   Jobs of other PRs or main run side by side — what separates the storage (`target/`) is
#   `scripts/with-target-lock.sh` below (it takes a free slot out of 3).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust
    # ⚠ **Gates that do not use docker go to this runner** (no docker.sock is passed).
    runs-on: [self-hosted, nolumialab]
    # ⚠ The default is 6 hours. A hung job would eat the runner, so set a limit.
    timeout-minutes: 60
    # ⚠ **Run the job itself inside this image** (changed when moving to forge).
    #   On GitHub, `dtolnay/rust-toolchain@stable` re-fetched via rustup every time and
    #   `Swatinem/rust-cache@v2` carried the build artifacts around.
    #   ⚠ **`Swatinem/rust-cache` does not work on act_runner** — it is
    #   `actions/cache` underneath, and the cache server listens on the runner container's IP,
    #   with no route from the job container. So **the toolchain is baked into the image
    #   and build artifacts go to named volumes** (defined in deploy-repo's
    #   `host/services/builders/ci-rust/`, allowed by the runner's `valid_volumes`).
    # ⚠ **Pin by digest.** With a tag, on the day the image is rebuilt
    #   "what passed yesterday fails today" happens and the cause cannot be traced.
    container:
      image: hub.nolumia.com:5000/builder/ci-rust@sha256:bf1efa0fcafc9c2b750b662f65d4173e6a707e734b67da612b385ff3e72f27a6
      # There are 3 `target/` storages (slots 1-3). There are 3 runners, so a 4th is not needed.
      #   Every job mounts all 3 and uses only the one taken in the first step
      #   (`scripts/with-target-lock.sh --take`, https://task.nolumia.com/issues/702).
      # ⚠ **`target/` grows without bound if left alone** (cargo never cleans old artifacts; one storage had
      #   accumulated 52 GB). When a slot is taken and exceeds 20 GB, it is emptied before use.
      #   The contents can be discarded any time (only the next run gets slower): `docker volume rm rust-target-cache-idp-ci-<slot>`.
      #   ⚠ **Do not put it on naso** (1 Gbps, devices get reshuffled by the weekly reboot, flock over the network is unreliable).
      options: >-
        -v rust-cargo-registry:/cache/cargo
        -v rust-target-cache-idp-ci-1:/cache/target-1
        -v rust-target-cache-idp-ci-2:/cache/target-2
        -v rust-target-cache-idp-ci-3:/cache/target-3
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: idp
          MARIADB_USER: idp
          MARIADB_PASSWORD: idp
          MARIADB_ROOT_PASSWORD: root
        # ⚠ **Do not write `ports:`** (removed when moving to forge). On GitHub runners
        #   the service was exposed to the host and reached at `127.0.0.1:3306`, but here
        #   the job is also inside a container, so it is reachable **as `mariadb:3306` on the same
        #   network**. Exposing it **occupies the host's 3306, and two runs can no longer run at once**.
        # ⚠ **Keep the data in memory (tmpfs)** (2026-09-30). The test DB is thrown away afterwards, yet
        #   the per-commit fsync reached nolumialab's NVMe (no DRAM, 100-300 ms per wait)
        #   and stalled k3s and deck on the same disk. runner-burst counts the limit
        #   as `shmem` in its memory estimate.
        options: >-
          --tmpfs /var/lib/mysql:rw,size=2g
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # ⚠ **Not `127.0.0.1`** (see the note above).
      DATABASE_URL: mysql://idp:idp@mariadb:3306/idp
      TEST_DATABASE_URL: mysql://idp:idp@mariadb:3306/idp
      # Move build artifacts and downloads to volumes (the workspace is wiped every time).
      # ⚠ Do not set `CARGO_TARGET_DIR` here. The slot-taking step passes it to later steps via `$GITHUB_ENV`.
      CARGO_HOME: /cache/cargo
      # ⚠ **Reduce the amount written** (2026-09-30). With the defaults, one run wrote about 63 GB to nolumialab's
      #   NVMe (no DRAM) and stalled k3s and deck on the same disk. Each test executable was
      #   around 450 MB, mostly debug info.
      #   - Keep only line tables in debug info (panic/backtrace locations show; variables do not)
      #   - Turn off incremental. It never hits in CI where contents change per PR, and `target/` had 19 GB of it
      #   ⚠ CI-only settings. Local builds are unchanged.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      # At least 32 characters (`assay_contracts::deployment::INTERNAL_SERVICE_TOKEN_MIN_LEN`). SEC11.
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-0123456789
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MARIADB_PASSWORD: idp
      MARIADB_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      # ⚠ **Do not write fixed `/tmp/<name>` paths in scripts/.** Locally, separate sessions run
      #   scripts concurrently in the same container, so fixed paths trample each other's intermediate output
      #   and fail at a different line each time (https://task.nolumia.com/tasks/86). ⚠ CI runs one at a
      #   time, so **tests do not catch it** — the literal is blocked here. Use `mktemp -d` for work dirs.
      #   ⚠ Lines starting with `#` (explanations) are excluded — otherwise a note could not name what is forbidden.
      - name: No fixed /tmp paths in scripts
        run: |
          if grep -nE '(^|[^A-Za-z0-9_])/tmp/' scripts/*.sh | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "scripts/ still contains a fixed /tmp path. Create a per-run work dir with mktemp -d." >&2
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Target lock tests
        run: ./scripts/test_with_target_lock.sh
      # ⚠ **Every step that uses `target/` must go through `scripts/with-target-lock.sh`, with this step before it.**
      #   The storage is shared between PR and main jobs, so running cargo without holding a slot lets
      #   another job delete the executables you built, turning red while the tests themselves are ok
      #   (5 times on 2026-09-16; symptoms and reasons are at the top of the script).
      #   The slot is held until the job ends — later steps may use what earlier steps built.
      #   ⚠ If all 3 are taken, it waits until one frees up, and that time counts toward `timeout-minutes`.
      - name: Take a target slot
        run: ./scripts/with-target-lock.sh --take
      - name: Clippy
        run: ./scripts/with-target-lock.sh cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and DB integration tests
        run: ./scripts/with-target-lock.sh cargo test --workspace --locked
      - name: Shell deployment tests
        run: ./scripts/test_deploy.sh
      - name: Remote build/deploy script tests
        run: ./scripts/test_build_remote.sh
      - name: E2E
        run: ./scripts/with-target-lock.sh ./scripts/e2e.sh

  bundle:
    name: Deploy bundle
    # ⚠ **Only this gate uses a different runner.** It runs `docker build`, so it goes to the runner
    #   whose job image has docker. ⚠ Jobs that land here are **equivalent to host root**
    #   (they hold the socket).
    runs-on: [nolumialab-docker]
    # ⚠ **Do not run on Renovate PRs** (task #603). This runner passes docker.sock to jobs
    #   — version-bump PRs run CI before a human looks at them, so a malicious dependency version
    #   would take host root on the spot. Skipped jobs count as green.
    if: github.event.pull_request.user.login != 'renovate'
    timeout-minutes: 45
    container:
      image: hub.nolumia.com:5000/builder/ci-docker@sha256:355d2a6999444d413b778291aa189459e933677a766183e27083d26d93189546
    # ⚠ **`docker compose config` resolves values, so the secrets need a "shape".**
    #   On GitHub one job did everything and the env placed on the `test` side
    #   applied here as well — **once split, if this is missing here it fails with
    #   `required variable ... is missing a value`** (measured 2026-09-11).
    #   ⚠ Dummy values are fine (nothing is started here).
    env:
      MARIADB_PASSWORD: idp
      MARIADB_ROOT_PASSWORD: root
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-0123456789
      KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7

      # ⚠ **Point docker's config directory at a writable place dedicated to this job.**
      #   The runner mounts the host's `/root/.docker` **read-only**.
      #   With the default, docker fails because it cannot create `~/.docker`, and Node
      #   reports read-only as **ENOENT** ("no such file"),
      #   so reading the log does not lead to the cause.
      # ⚠ **Cannot be set in the job's `env:`.** `runner` is not an available context there, and
      #   writing `${{ runner.temp }}` **makes loading the whole workflow fail**.
      - name: Prepare docker config directory
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - name: Docker build and deploy bundle
        run: ./scripts/build.sh

      # ⚠ **`config` only assembles; it does not mount.** There are 18 relative bind mounts,
      #   but no empty directories get created here (that happens
      #   on `up`).
      # ⚠ **Why not `--quiet`**: we want to check the **resolved values**, not just the syntax, but
      #   the output goes to a file and not to the screen — `docker compose config` expands
      #   secrets in plain text.
      - name: Compose config
        run: |
          docker compose -f docker-compose.yml config >/tmp/compose.yml
          docker compose -f docker-compose.deploy.yml config >/tmp/compose.deploy.yml

      # The runner is docker-out-of-docker (uses the host daemon directly), so
      # built images stay on the host after the job ends. Clean them up here.
      - name: Clean up (remove built images)
        if: always()
        run: |
          docker image rm -f idp/api:latest idp/web:latest idp/migrate:latest || true
