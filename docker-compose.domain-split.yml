# Override for domain-split publishing (ADR-0012, ADR-0015). Layered on top of the base Compose.
# Same "just add via override" shape as `docker-compose.db-debug.yml`.
#
#   docker compose -f docker-compose.deploy.yml -f docker-compose.domain-split.yml up -d
#
# No need to list -f by hand. `PUBLISH_TOPOLOGY` **defaults to domain-split** (ADR-0016), so
# `scripts/deploy.sh` layers this file even if `.env` does not specify it. Only to go back to single origin,
# state `PUBLISH_TOPOLOGY=single-origin` in `.env` (then this file is not layered).
#
# Only two changes, both to proxy:
#   1. Replace the nginx config with the port-split version (volumes merge keyed by mount target path)
#   2. Add the public port for api (ports merge by appending; the base WEB_PORT->8080 remains)
# api and web containers are not published (the only public point is proxy).
services:
  proxy:
    volumes:
      - ./docker/nginx.domain-split.conf:/etc/nginx/nginx.conf:ro
    ports:
      # In addition to the base "${WEB_BIND_HOST}:${WEB_PORT}:8080" (= web), publish the api side.
      # Cannot be the same value as WEB_PORT (host port conflict).
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8070}:8081"
