# Override layered only when you want a maintenance connection to MariaDB from the host.
# Example: docker compose -f docker-compose.deploy.yml -f docker-compose.db-debug.yml --profile db-debug up -d mariadb
services:
  mariadb:
    profiles: ["db-debug"]
    ports:
      - "${MARIADB_BIND_HOST:-127.0.0.1}:${MARIADB_PORT:-3306}:3306"
