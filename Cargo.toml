[workspace]
resolver = "2"
members = ["crates/core", "crates/contracts", "crates/api", "crates/web"]

# Workspace-wide lint policy (each crate references it with `[lints] workspace = true`).
#
# `result_large_err`: axum handlers and gates return failures as `Response` (128 bytes). With clippy 0.1.98
# it started hitting exactly this threshold (default 128 bytes), but the `Err` here is "the response about to be
# returned" itself; wrapping it in `Box` only makes callers unbox it again, and departs from axum's idiom of
# returning `IntoResponse`. Rather than scattering `#[allow]` over 38 places in the presentation layer, allow it once
# here as policy (CI runs with `-D warnings`, so the allowance must be explicit).
[workspace.lints.clippy]
result_large_err = "allow"

# Workspace-wide dependency versions (each crate references them with `workspace = true`).
# ADR-0007 (API/Web service split): P1 split into core (domain/application/infrastructure) and api (presentation +
# binary). P3 added contracts (serde DTO contracts) and web (HTML rendering + API client).
[workspace.dependencies]
# `time` is used for retry backoff and periodic-rotation sleeps (made explicit rather than relying on
# feature unification via sqlx).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
# HTTP basic types only (no axum dependency). Used in contracts so api / web create the same HTTP spans.
http = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "chrono",
    "uuid",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
async-trait = "0.1"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# RSA signing, verification and key generation use aws-lc-rs (constant-time implementation; the same as jsonwebtoken's `aws_lc_rs`).
# RustCrypto's rsa 0.9 can leak the key through private-key operation timing (RUSTSEC-2023-0071 / CVE-2023-49092, no fixed version)
# and pinned sha2 / hmac / p256 / x509-cert / rand to the digest 0.10 generation, so it was removed.
aws-lc-rs = "1"
# Used only to read/write key containers (PKCS#8 / SPKI). Operations are left to aws-lc-rs.
pkcs8 = { version = "0.11", features = ["std", "pem"] }
p256 = { version = "0.14", features = ["pkcs8", "pem"] }
aes-gcm = "0.11"
# `oid` is used for RSA signatures of SAML responses (generating the PKCS#1 v1.5 DigestInfo).
sha2 = { version = "0.11", features = ["oid"] }
# Used because the range API for breached-password checks (AP7) looks up by SHA-1 prefix.
# Not used for storage or authentication (storage uses argon2).
sha1 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
rand = "0.10"
argon2 = "0.6"
url = "2"
percent-encoding = "2"
# Startup validation of COOKIE_DOMAIN (rejects public suffixes, ADR-0012 §Consequences).
psl = "2"
# XML parsing of SAML metadata (importing external IdP metadata) and XML generation (our own SP metadata output).
# In 0.38 entity references (`&amp;` etc.) split into a separate `GeneralRef` event, and 0.40 added attribute value normalization --
# both are handled in domain::xml_text. In 0.42 names and values changed from `&[u8]` to `&str`.
# All of these touch the semantics of xml_c14n / xml_signature (XML signature canonicalization and verification), so when bumping
# the version, move it as a standalone change, not mixed into a bulk dependency update.
quick-xml = "0.42"
# DEFLATE inflation for the SAML HTTP-Redirect binding (`SAMLRequest` = base64(raw-deflate(xml))).
flate2 = "1"
# Extracts the public key from an external SAML IdP's signing certificate (`<ds:X509Certificate>`) (AP12).
# Only SubjectPublicKeyInfo is used for verification; the certificate chain is not validated (the root of trust is
# "the admin registered this certificate", not a CA, ADR-0027).
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
fluent = "0.17"
unic-langid = { version = "0.9", features = ["macros"] }
# Templates for server rendering in the web crate (compile-time type checking, automatic HTML escaping).
askama = "0.16"
# API client of the web crate (access over HTTP so it doesn't depend on core/sqlx). TLS is rustls.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls"] }
# TOTP (RFC 6238) generation and verification (MFA self-enrollment).
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
# Generates QR codes as SVG (embedded in the TOTP setup screen).
qrcode = "0.14"
# SMTP mail delivery (invitation mail MT17, password reset MT18). TLS is rustls.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }
# HTTP mock server stubbing the api in the web crate's integration tests (G11; no DB needed, so CI is fast).
wiremock = "0.6"
# WebAuthn (FIDO2 passkey) authentication library.
# danger-allow-state-serialisation: needed to store challenge state in the DB (safe because it is managed server-side).
# conditional-ui: support for discoverable credentials (username-less passkey login).
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# `ResidentKeyRequirement` is not in webauthn-rs's prelude, so the protocol types are referenced directly
# (the same crate and same version webauthn-rs uses internally).
webauthn-rs-proto = { version = "0.5" }
# Metrics (G6). `metrics` is the instrumentation facade (positioned like `tracing`), used by both core and api.
# Only the api owns collection and rendering (since the api is the one serving `/metrics`).
# metrics-exporter-prometheus pulls in a push gateway and HTTP listener by default, so default features are off
# and only rendering is used (serving is done via an axum route).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
