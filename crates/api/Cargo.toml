[package]
name = "assay-api"
version = "0.1.0"
edition = "2021"
description = "OIDC IdP API: axum presentation (protocol + JSON admin + admin console) and binaries"
license = "MIT"

[lib]
name = "assay_api"
path = "src/lib.rs"

[[bin]]
name = "assay"
path = "src/main.rs"

# Tool run once when rotating the key (task #618). Shipped in the api image, does nothing until invoked.
[[bin]]
name = "assay-rewrap-secrets"
path = "src/bin/rewrap_secrets.rs"

[lints]
workspace = true

[dependencies]
assay-core = { path = "../core" }
assay-contracts = { path = "../contracts" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
fluent = { workspace = true }
unic-langid = { workspace = true }
reqwest = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
# Signs with P-256 in place of the authenticator app's key (tests/app_approval.rs, task #892).
aws-lc-rs = { workspace = true }
tower = { workspace = true, features = ["util"] }
# DPoP tests (ADR-0075): build proofs with a P-256 key in place of the app.
p256 = { workspace = true }
jsonwebtoken = { workspace = true }
# AuthnRequest compression in SAML SSO tests (DEFLATE of the HTTP-Redirect binding).
flate2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# web->api E2E tests (ADR-0012 §7): start api/web together as real servers and verify, with a
# cookie-jar-enabled client, how the SSO cookie crosses over in real behaviour. As a dev-dependency
# it does not break web's "no sqlx dependency" crate boundary (ADR-0007).
assay-web = { path = "../web" }
reqwest = { workspace = true, features = ["cookies"] }
