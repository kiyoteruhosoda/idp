[package]
name = "idp-api"
version = "0.1.0"
edition = "2021"
description = "OIDC IdP API: axum presentation（protocol + JSON 管理 + 管理コンソール）とバイナリ"
license = "MIT"

[lib]
name = "idp_api"
path = "src/lib.rs"

[[bin]]
name = "idp"
path = "src/main.rs"

[dependencies]
idp-core = { path = "../core" }
idp-contracts = { path = "../contracts" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
fluent = { workspace = true }
unic-langid = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
jsonwebtoken = { workspace = true }
# SAML SSO テストでの AuthnRequest 圧縮（HTTP-Redirect binding の DEFLATE）。
flate2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# web→api E2E テスト（ADR-0012 §7）: api/web を実サーバとして同時起動し、Cookie jar 有効の
# クライアントで SSO Cookie の越境を実挙動で検証する。dev-dependency のため web の
# 「sqlx 非依存」という crate 境界（ADR-0007)は侵さない。
idp-web = { path = "../web" }
reqwest = { workspace = true, features = ["cookies"] }
