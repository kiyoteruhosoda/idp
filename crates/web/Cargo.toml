[package]
name = "assay-web"
version = "0.1.0"
edition = "2021"
description = "OIDC IdP Web: HTML rendering (login screens and admin console) + i18n + API client"
license = "MIT"

[lib]
name = "assay_web"
path = "src/lib.rs"

[[bin]]
name = "assay-web"
path = "src/main.rs"

[lints]
workspace = true

# The core of ADR-0007: web does not depend on the DB (sqlx) / infrastructure. Data operations go to api over HTTP.
# Not listing assay-core as a dependency (so sqlx is not pulled in indirectly) enforces this at the crate boundary.
[dependencies]
percent-encoding = { workspace = true }
assay-contracts = { path = "../contracts" }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Startup time and server time (`/internal/health`, ADR-0031).
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
fluent = { workspace = true }
unic-langid = { workspace = true }
askama = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
qrcode = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
# Integration tests through the router (G11). Stubs api over HTTP and verifies cookies, CSRF, redirects and
# the api client's error handling without a DB.
wiremock = { workspace = true }
