[package]
name = "assay-web"
version = "0.1.0"
edition = "2021"
description = "OIDC IdP Web: HTML 描画（ログイン画面・管理コンソール）+ i18n + API クライアント"
license = "MIT"

[lib]
name = "assay_web"
path = "src/lib.rs"

[[bin]]
name = "assay-web"
path = "src/main.rs"

[lints]
workspace = true

# ADR-0007 の肝: web は DB（sqlx）/ infrastructure に依存しない。データ操作は api へ HTTP 越しに行う。
# 依存に assay-core を含めない（sqlx を間接依存させない）ことを crate 境界で強制する。
[dependencies]
percent-encoding = { workspace = true }
assay-contracts = { path = "../contracts" }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 起動時刻・サーバー時刻（`/internal/health`。ADR-0031）。
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
fluent = { workspace = true }
unic-langid = { workspace = true }
askama = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
qrcode = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
# ルータ経由の統合テスト（G11）。api を HTTP でスタブし、DB 無しで Cookie・CSRF・リダイレクト・
# api クライアントのエラー処理を検証する。
wiremock = { workspace = true }
