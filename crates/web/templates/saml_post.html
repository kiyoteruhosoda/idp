{% extends "page.html" %}
{% block title %}{{ messages.get("saml-continue-title") }}{% endblock %}
{% block content %}
<div class="card border-0 bg-transparent">
  <div class="card-header text-center py-3 border-0 bg-transparent">
    <h1 class="h4 mb-0">{{ messages.get("saml-continue-title") }}</h1>
  </div>
  <div class="card-body p-4 text-center">
    <p class="mb-3">{{ messages.get("saml-continue-message") }}</p>
    <form id="saml-post-form" method="post" action="{{ acs_url }}">
      <input type="hidden" name="SAMLResponse" value="{{ saml_response }}">
      {% if let Some(relay_state) = relay_state %}
      <input type="hidden" name="RelayState" value="{{ relay_state }}">
      {% endif %}
      <noscript>
        <button type="submit" class="btn btn-primary">{{ messages.get("saml-continue-submit") }}</button>
      </noscript>
    </form>
  </div>
</div>
<script>document.getElementById('saml-post-form').submit();</script>
{% endblock %}
