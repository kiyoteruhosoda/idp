[package]
name = "assay-contracts"
version = "0.1.0"
edition = "2021"
description = "OIDC IdP inter-service DTO contracts (shared by the api server and the web client). DB-independent."
license = "MIT"

[lib]
name = "assay_contracts"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Application log ingestion layer (shared implementation so api / web build records the same way).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Single definition of the HTTP access span (SEC9). Depends only on `http` basic types, not axum.
http = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
psl = { workspace = true }

[dev-dependencies]
# Test that WARN is not dropped even after a library call through `log` (task #801).
log = "0.4"
