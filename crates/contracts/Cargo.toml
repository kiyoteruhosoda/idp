[package]
name = "assay-contracts"
version = "0.1.0"
edition = "2021"
description = "OIDC IdP サービス間 DTO 契約（api サーバ ↔ web クライアントで共有）。DB 非依存。"
license = "MIT"

[lib]
name = "assay_contracts"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# アプリケーションログ取り込み層（api / web が同じ形でレコードを組み立てるための共有実装）。
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# HTTP アクセススパンの単一定義（SEC9）。axum ではなく `http` の基本型にのみ依存する。
http = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
psl = { workspace = true }
