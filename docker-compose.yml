# Compose for development/build (for hosts with the source; api/web/migrate are built from source via build:).
# Deployment targets without the source use docker-compose.deploy.yml instead, which references prebuilt images via image:
# (scripts/deploy.sh uses that one). For handing over images see scripts/README.md "Host separation".
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-idp}
      MARIADB_USER: ${MARIADB_USER:-idp}
      # Secrets are managed centrally in .env (see .env.example; generated by scripts/deploy.sh).
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
    ports:
      - "${MARIADB_BIND_HOST:-127.0.0.1}:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # api service (ADR-0007). OIDC protocol, JSON admin API, internal API. The only service connected directly to the DB.
  # Does not apply migrations; only checks the version at startup (fail-fast). DDL is applied by the migrate job.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-api
      args:
        # Compose cannot run a shell, so the value is passed from the host's environment variable. If not passed it
        # becomes `unknown` (`.git` is excluded by .dockerignore, so git is unavailable during the build).
        #   IDP_GIT_VERSION=$(git describe --always --dirty --tags) docker compose build
        # Deployment artifacts are filled in automatically by scripts/build.sh, so this is for development builds.
        IDP_GIT_VERSION: ${IDP_GIT_VERSION:-unknown}
        IDP_BUILD_NUMBER: ${IDP_BUILD_NUMBER:-}
    environment:
      ISSUER: ${ISSUER:-http://localhost:8080}
      BIND_ADDR: 0.0.0.0:8080
      # Resolved by the service name mariadb (inside the Compose network).
      DATABASE_URL: mysql://${MARIADB_USER:-idp}:${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}@mariadb:3306/${MARIADB_DATABASE:-idp}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info,assay=info}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:?set KEY_ENCRYPTION_KEY in .env}
      # Shared secret protecting web->api /internal/* (ADR-0007 §5; same value as web).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      # If unspecified (empty), decided automatically from the issuer's scheme (enabled for https).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # The development stack exposes Swagger UI (/api/docs). Keep the default (false) in public environments
      # -- the whole spec, including the admin API, would be readable without authentication (SEC12).
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      AUTH_SESSION_TTL_SECS: ${AUTH_SESSION_TTL_SECS:-}
      AUTHORIZATION_CODE_TTL_SECS: ${AUTHORIZATION_CODE_TTL_SECS:-}
      SSO_IDLE_TTL_SECS: ${SSO_IDLE_TTL_SECS:-}
      SSO_ABSOLUTE_TTL_SECS: ${SSO_ABSOLUTE_TTL_SECS:-}
      ACCESS_TOKEN_TTL_SECS: ${ACCESS_TOKEN_TTL_SECS:-}
      ID_TOKEN_TTL_SECS: ${ID_TOKEN_TTL_SECS:-}
      REFRESH_TOKEN_TTL_SECS: ${REFRESH_TOKEN_TTL_SECS:-}
      CLOCK_SKEW_SECS: ${CLOCK_SKEW_SECS:-}
      INVITATION_TTL_SECS: ${INVITATION_TTL_SECS:-}
      PASSWORD_RESET_TTL_SECS: ${PASSWORD_RESET_TTL_SECS:-}
      EMAIL_VERIFICATION_TTL_SECS: ${EMAIL_VERIFICATION_TTL_SECS:-}
      TENANT_CACHE_TTL_SECS: ${TENANT_CACHE_TTL_SECS:-}
      PERMISSION_CACHE_TTL_SECS: ${PERMISSION_CACHE_TTL_SECS:-}
      KEY_ROTATION_LEAD_DAYS: ${KEY_ROTATION_LEAD_DAYS:-}
      KEY_ROTATION_PUBLISH_LEAD_HOURS: ${KEY_ROTATION_PUBLISH_LEAD_HOURS:-}
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-}
      CSRF_SECRET: ${CSRF_SECRET:-}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-}
      # Domain attribute of the cross-service Cookie (domain-split only; ADR-0012; same value as web).
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    # Not exposed externally by default (reachable only via the proxy). Enable the following for debugging.
    # ports:
    #   - "8080:8080"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # web service (ADR-0007). HTML screens (login, admin console) and the API client. Independent of the DB.
  # Data operations go to the api over HTTP (no sqlx).
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-web
      args:
        # Compose cannot run a shell, so the value is passed from the host's environment variable. If not passed it
        # becomes `unknown` (`.git` is excluded by .dockerignore, so git is unavailable during the build).
        #   IDP_GIT_VERSION=$(git describe --always --dirty --tags) docker compose build
        # Deployment artifacts are filled in automatically by scripts/build.sh, so this is for development builds.
        IDP_GIT_VERSION: ${IDP_GIT_VERSION:-unknown}
        IDP_BUILD_NUMBER: ${IDP_BUILD_NUMBER:-}
    environment:
      WEB_BIND_ADDR: 0.0.0.0:8081
      # Connects directly to the api from the server side (inside the Compose network; not through the proxy).
      API_BASE_URL: http://api:8080
      ISSUER: ${ISSUER:-http://localhost:8080}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info,assay_web=info}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      CSRF_SECRET: ${CSRF_SECRET:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-}
      # Whether to trust `X-Forwarded-For` for the client IP (SEC1; same value as api). The IP web builds
      # becomes the IP in the api's rate limiting and audit logs, so use the same value in both services.
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-}
      # web's own public origin (domain-split only; ADR-0012; same value as api).
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Reverse proxy (ADR-0007 §2). Routes browser traffic on a single origin to web/api by path.
  # /login, /admin/console/* -> web, /internal/* blocked, everything else -> api.
  # This file (development/build) alone is a single-origin setup. The default topology is domain-split (ADR-0016),
  # and `.env.example`'s ISSUER (api = API_PORT) and PUBLIC_WEB_BASE_URL (web = WEB_PORT) also assume separate origins,
  # so if you use that .env as is, layer the override
  # (on the deploy path deploy.sh layers it automatically; -f is needed only when starting by hand):
  #   docker compose -f docker-compose.yml -f docker-compose.domain-split.yml up -d
  # To run single-origin, align .env's ISSUER and PUBLIC_WEB_BASE_URL to the same origin on WEB_PORT.
  proxy:
    image: nginx:1.30-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8060}:8080"
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 128
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Dedicated one-shot job applying DDL and master data. Excluded from normal startup via profiles so it does not stay running;
  # run on its own with `docker compose run --rm migrate` (used by scripts/deploy.sh).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-idp}:${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}@mariadb:3306/${MARIADB_DATABASE:-idp}
    depends_on:
      mariadb:
        condition: service_healthy
    profiles: ["tools"]

  # For the MVP the session store is MariaDB alone. Redis is enabled when scaling.
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles: ["optional"]

volumes:
  mariadb_data:
